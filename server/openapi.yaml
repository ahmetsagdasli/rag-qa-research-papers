openapi: 3.0.3
info: { title: Advanced RAG Platform API, version: 2.1.0 }
servers: [ { url: http://localhost:5050 } ]
paths:
  /health:
    get: { summary: Health check, responses: { '200': { description: Healthy } } }

  /api/collections:
    get: { summary: List collections (folders) with document/answer counts, responses: { '200': { description: Collections } } }
    post:
      summary: Create a collection (folder)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: {type: string} } } } } }
      responses: { '200': { description: Created collection }, '400': { description: name is required } }
  /api/collections/{id}:
    delete: { summary: Delete a collection, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Deleted } } }

  /api/collections/{id}/documents:
    get: { summary: List documents in a collection, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Documents } } }
    post:
      summary: Upload a PDF to a collection (not indexed yet — call reindex next)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: {type: string, format: binary} } } } } }
      responses: { '200': { description: Uploaded document }, '400': { description: No file uploaded }, '404': { description: Folder not found }, '413': { description: PDF must be 25 MB or smaller }, '415': { description: Only PDF files are accepted } }
  /api/documents:
    get: { summary: List all documents (optional ?collectionId filter) for scope pickers, responses: { '200': { description: Documents } } }
  /api/documents/{id}:
    delete: { summary: Delete a document and re-trigger indexing for its collection, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '202': { description: Reindex job started, content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }, '404': { description: Document not found } } }

  /api/collections/{id}/reindex:
    post:
      summary: Rebuild embeddings for a collection (background job)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { chunking: {type: object} } } } } }
      responses: { '202': { description: Index job started, content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }, '404': { description: Folder not found } }
  /api/jobs/{id}:
    get:
      summary: Read indexing job status
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Job status, content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }, '404': { description: Job not found } }

  /api/retrieval/modes:
    get: { summary: List semantic, BM25, and hybrid modes, responses: { '200': { description: Retrieval modes } } }
  /api/retrieval/search:
    post:
      summary: Inspect retrieval candidates
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RetrievalRequest' } } } }
      responses: { '200': { description: Ranked candidates and inspector data } }

  /api/ask:
    post:
      summary: Ask grounded question with retrieval and query transformation settings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AskRequest' } } } }
      responses: { '200': { description: Answer, citations, and inspector } }

  /api/evaluation-datasets:
    get: { summary: List JSONL evaluation datasets, responses: { '200': { description: Dataset metadata } } }
    post:
      summary: Validate and save JSONL dataset
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id,jsonl], properties: { id: {type: string}, jsonl: {type: string} } } } } }
      responses: { '201': { description: Dataset saved }, '422': { description: Validation failed } }
  /api/evaluation-datasets/validate:
    post: { summary: Validate JSONL without saving, responses: { '200': { description: Validation report } } }
  /api/evaluation-datasets/{id}:
    get: { summary: Read evaluation dataset, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Dataset } } }

  /api/evaluations:
    get: { summary: List experiment history, responses: { '200': { description: Evaluation runs } } }
    post:
      summary: Start a dataset evaluation (background job — retrieval runs once per dataset item, so it is queued rather than run inline)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationRequest' } } } }
      responses: { '202': { description: Evaluation job started, content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }, '404': { description: Evaluation dataset not found }, '422': { description: Evaluation dataset is invalid } }
  /api/evaluation-jobs/{id}:
    get:
      summary: Read evaluation job status; job.result holds the persisted evaluation once completed
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Job status, content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }, '404': { description: Evaluation job not found } }
  /api/evaluations/{id}:
    get: { summary: Read persisted evaluation, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Evaluation }, '404': { description: Evaluation not found } } }
  /api/evaluations/{id}/repeat:
    post: { summary: Repeat an evaluation for ranking stability, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '201': { description: Reproducibility result }, '404': { description: Evaluation not found }, '422': { description: Dataset unavailable or invalid } } }
  /api/evaluations/{id}/reproducibility:
    get: { summary: List persisted reproducibility results, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Stability history } } }

  /api/graph-retrieval/search:
    post: { summary: Experimental graph evidence search, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [query], properties: { query: {type: string}, collectionId: {type: integer}, limit: {type: integer} } } } } }, responses: { '200': { description: Experimental graph evidence }, '503': { description: Graph retrieval unavailable } } }
  /api/graph-retrieval/collections/{id}/rebuild:
    post:
      summary: Rebuild experimental entity/relationship graph (background job — one LLM call per chunk, so it is queued rather than run inline)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '202': { description: Graph rebuild job started, content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }, '503': { description: Graph rebuild unavailable (requires DATABASE_URL) } }
  /api/graph-retrieval/jobs/{id}:
    get:
      summary: Read graph rebuild job status; job.result holds {chunks,nodes,edges} once completed
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Job status, content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }, '404': { description: Graph rebuild job not found } }

  /api/collections/{id}/answers:
    get: { summary: List saved answers for a collection, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Saved answers } } }
  /api/answers:
    post:
      summary: Save an answer to a collection
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [question,answer], properties: { collectionId: {type: integer, nullable: true}, documentId: {type: integer, nullable: true}, question: {type: string}, answer: {type: string}, sources: {type: array, items: {type: object}} } } } } }
      responses: { '200': { description: Saved answer }, '400': { description: question and answer are required } }

components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Only enforced when the server's API_KEY env var is set; unset by default for local/single-user use.
  schemas:
    RetrievalRequest:
      type: object
      required: [question]
      properties: { question: {type: string}, mode: {type: string, enum: [semantic,bm25,hybrid]}, topN: {type: integer}, scope: {type: object} }
    AskRequest:
      type: object
      required: [question]
      properties: { question: {type: string}, retrievalMode: {type: string, enum: [semantic,bm25,hybrid]}, queryTransformation: {type: string, enum: [none,rewrite,multi_query,decompose]}, topK: {type: integer}, scope: {type: object} }
    EvaluationRequest:
      type: object
      required: [datasetId]
      properties: { datasetId: {type: string}, retrievalMode: {type: string, enum: [semantic,bm25,hybrid]}, topK: {type: integer}, scope: {type: object}, includeFaithfulness: {type: boolean} }
    JobResponse:
      type: object
      properties: { id: {type: string}, status: {type: string, enum: [queued,processing,completed,failed]}, progress: {type: integer}, step: {type: string}, result: {type: object, nullable: true}, error: {type: string, nullable: true} }
    JobEnvelope:
      type: object
      properties: { ok: {type: boolean}, job: { $ref: '#/components/schemas/JobResponse' } }
security:
  - ApiKeyAuth: []
